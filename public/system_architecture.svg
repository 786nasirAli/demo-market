<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #FFFFFF; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .section-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .card-body { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 400; fill: #94A3B8; line-height: 1.5; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .tag-text { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #38BDF8; }
    .flow-label { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; fill: #64748B; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bg-grad)" />

  <!-- Grid Decoration -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="150" x2="1200" y2="150" stroke-dasharray="4,4" />
    <line x1="0" y1="380" x2="1200" y2="380" stroke-dasharray="4,4" />
    <line x1="0" y1="560" x2="1200" y2="560" stroke-dasharray="4,4" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 40)">
    <!-- Icon Symbol -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <path d="M 14 22 L 22 14 L 30 22 L 22 30 Z" fill="none" stroke="#38BDF8" stroke-width="2" />
    <circle cx="22" cy="22" r="3" fill="#38BDF8" />

    <text x="56" y="22" class="title">Demo Market – System Design Architecture</text>
    <text x="56" y="40" class="subtitle">Full-Stack Multi-Vendor E-Commerce MVP with Dynamic Bed Customizer &amp; Supabase PostgreSQL</text>

    <!-- Top Technology Badges -->
    <g transform="translate(730, 8)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="14" y="16" class="badge-text" fill="#38BDF8">Next.js 16</text>

      <rect x="84" y="0" width="74" height="24" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="96" y="16" class="badge-text" fill="#61DAFB">React 19</text>

      <rect x="166" y="0" width="94" height="24" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="178" y="16" class="badge-text" fill="#10B981">Supabase DB</text>

      <rect x="268" y="0" width="76" height="24" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="282" y="16" class="badge-text" fill="#F43F5E">PWA Live</text>
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- LAYER 1: CLIENT PRESENTATION LAYER (DEVICES & ROLES) -->
  <!-- ==================================================== -->
  <g transform="translate(60, 115)">
    <text x="0" y="0" class="section-label" fill="#38BDF8">1. Client &amp; Presentation Layer (Installable PWA)</text>

    <!-- Card 1: Buyer Experience -->
    <g transform="translate(0, 15)">
      <rect width="345" height="180" rx="16" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8" />
      <rect x="18" y="18" width="8" height="8" rx="4" fill="#38BDF8" />
      <text x="34" y="26" class="card-title">Buyer Experience (Shop &amp; Configurator)</text>
      
      <text x="20" y="56" class="card-body">• Dynamic Prague Divan Bed customizer</text>
      <text x="20" y="78" class="card-body">• Interactive fabric swatch palette (Naples velvet)</text>
      <text x="20" y="100" class="card-body">• Live price calculation (Size, Headboard, Storage)</text>
      <text x="20" y="122" class="card-body">• 5-photo responsive carousel &amp; lightbox zoom</text>
      <text x="20" y="144" class="card-body">• Persistent shopping cart &amp; fast checkout flow</text>

      <rect x="235" y="148" width="92" height="20" rx="5" fill="#0C4A6E" />
      <text x="243" y="162" class="tag-text">Next.js Client</text>
    </g>

    <!-- Card 2: Multi-Vendor Seller Portal -->
    <g transform="translate(365, 15)">
      <rect width="345" height="180" rx="16" fill="url(#card-grad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8" />
      <rect x="18" y="18" width="8" height="8" rx="4" fill="#10B981" />
      <text x="34" y="26" class="card-title">Multi-Vendor Seller Dashboard</text>
      
      <text x="20" y="56" class="card-body">• Product CRUD: Add / edit bespoke handcrafted beds</text>
      <text x="20" y="78" class="card-body">• 5-Slot Photo Manager (Cover + 4 gallery angles)</text>
      <text x="20" y="100" class="card-body">• Dual upload engine: Local computer files &amp; web URLs</text>
      <text x="20" y="122" class="card-body">• Bulk URL paste with auto-slot distribution</text>
      <text x="20" y="144" class="card-body">• Real-time order fulfillment &amp; tracking updates</text>

      <rect x="225" y="148" width="102" height="20" rx="5" fill="#064E3B" />
      <text x="233" y="162" class="tag-text" fill="#34D399">Seller Portal</text>
    </g>

    <!-- Card 3: Admin Governance Portal -->
    <g transform="translate(730, 15)">
      <rect width="350" height="180" rx="16" fill="url(#card-grad)" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.8" />
      <rect x="18" y="18" width="8" height="8" rx="4" fill="#A855F7" />
      <text x="34" y="26" class="card-title">Admin Governance &amp; Moderation</text>
      
      <text x="20" y="56" class="card-body">• Role-based route gating (Strict admin protection)</text>
      <text x="20" y="78" class="card-body">• Product approval queue (Pending / Approved / Hidden)</text>
      <text x="20" y="100" class="card-body">• Multi-vendor seller identity verification</text>
      <text x="20" y="122" class="card-body">• 0ms Optimistic UI updates with instant badge sync</text>
      <text x="20" y="144" class="card-body">• Marketplace catalog health monitoring</text>

      <rect x="230" y="148" width="102" height="20" rx="5" fill="#581C87" />
      <text x="238" y="162" class="tag-text" fill="#C084FC">Admin Guard</text>
    </g>
  </g>

  <!-- Flow Connector: Layer 1 to Layer 2 -->
  <g transform="translate(60, 325)">
    <line x1="172" y1="0" x2="172" y2="40" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-down)" />
    <line x1="537" y1="0" x2="537" y2="40" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-emerald)" />
    <line x1="905" y1="0" x2="905" y2="40" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-down)" />
    <text x="545" y="25" class="flow-label">HTTPS JSON API / Next.js Actions</text>
  </g>

  <!-- ==================================================== -->
  <!-- LAYER 2: APPLICATION & COMPUTE ENGINE LAYER (VERCEL) -->
  <!-- ==================================================== -->
  <g transform="translate(60, 380)">
    <text x="0" y="0" class="section-label" fill="#10B981">2. Application &amp; Serverless Compute Layer (Next.js 16 on Vercel)</text>

    <!-- Main Container Card -->
    <g transform="translate(0, 15)">
      <rect width="1080" height="135" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

      <!-- Module A: Server Components & Edge SSR -->
      <g transform="translate(25, 20)">
        <rect width="240" height="95" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
        <text x="16" y="28" class="card-title" font-size="13">Edge SSR &amp; Turbopack</text>
        <text x="16" y="50" class="card-body">Next.js 16 App Router</text>
        <text x="16" y="68" class="card-body">React 19 Server Components</text>
        <text x="16" y="86" class="tag-text">Sub-100ms TTFB</text>
      </g>

      <!-- Module B: REST API Route Handlers -->
      <g transform="translate(285, 20)">
        <rect width="250" height="95" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1" />
        <text x="16" y="28" class="card-title" font-size="13">REST API Route Handlers</text>
        <text x="16" y="50" class="card-body">• /api/products &amp; /api/products/[id]</text>
        <text x="16" y="68" class="card-body">• /api/orders &amp; /api/orders/[id]/status</text>
        <text x="16" y="86" class="card-body">• /api/admin/products &amp; /sellers</text>
      </g>

      <!-- Module C: Server Pricing Security Engine -->
      <g transform="translate(555, 20)">
        <rect width="250" height="95" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
        <text x="16" y="28" class="card-title" font-size="13">Pricing Integrity Engine</text>
        <text x="16" y="50" class="card-body">• Strict integer pence arithmetic</text>
        <text x="16" y="68" class="card-body">• Recomputes base + options</text>
        <text x="16" y="86" class="tag-text" fill="#FBBF24">Anti-Tampering Guard</text>
      </g>

      <!-- Module D: Optimistic UI Engine -->
      <g transform="translate(825, 20)">
        <rect width="230" height="95" rx="10" fill="#0F172A" stroke="#EC4899" stroke-width="1" />
        <text x="16" y="28" class="card-title" font-size="13">Resilient Repository</text>
        <text x="16" y="50" class="card-body">• 0ms Optimistic state updates</text>
        <text x="16" y="68" class="card-body">• Supabase primary with cache</text>
        <text x="16" y="86" class="tag-text" fill="#F472B6">High Availability</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: Layer 2 to Layer 3 -->
  <g transform="translate(60, 545)">
    <line x1="540" y1="0" x2="540" y2="35" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-emerald)" />
    <text x="555" y="22" class="flow-label">PostgreSQL Client / Service Role / Secure SSL</text>
  </g>

  <!-- ==================================================== -->
  <!-- LAYER 3: DATA PERSISTENCE & CLOUD LAYER (SUPABASE)   -->
  <!-- ==================================================== -->
  <g transform="translate(60, 595)">
    <text x="0" y="0" class="section-label" fill="#A855F7">3. Data Persistence &amp; Security Layer (Supabase PostgreSQL)</text>

    <!-- Schema Entities Container -->
    <g transform="translate(0, 15)">
      <rect width="1080" height="115" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

      <!-- Table 1: Products & Images -->
      <g transform="translate(25, 18)">
        <rect width="240" height="80" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1" />
        <text x="14" y="24" class="card-title" font-size="12">products &amp; product_images</text>
        <text x="14" y="44" class="card-body">UUID pk, title, base_price, status</text>
        <text x="14" y="62" class="card-body">5-slot photos, display_order, URLs</text>
      </g>

      <!-- Table 2: Variation Groups & Options -->
      <g transform="translate(285, 18)">
        <rect width="250" height="80" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1" />
        <text x="14" y="24" class="card-title" font-size="12">variation_groups &amp; options</text>
        <text x="14" y="44" class="card-body">Colour swatches, 6 bed sizes, storage</text>
        <text x="14" y="62" class="card-body">extra_price, swatch_hex, default flags</text>
      </g>

      <!-- Table 3: Orders & Line Items -->
      <g transform="translate(555, 18)">
        <rect width="250" height="80" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1" />
        <text x="14" y="24" class="card-title" font-size="12">orders &amp; order_items</text>
        <text x="14" y="44" class="card-body">Verified total_price, buyer metadata</text>
        <text x="14" y="62" class="card-body">Status: Pending / Processing / Shipped</text>
      </g>

      <!-- Table 4: RLS Security Policies -->
      <g transform="translate(825, 18)">
        <rect width="230" height="80" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1" />
        <text x="14" y="24" class="card-title" font-size="12" fill="#34D399">Row Level Security (RLS)</text>
        <text x="14" y="44" class="card-body">Permissive CRUD policies enabled</text>
        <text x="14" y="62" class="tag-text" fill="#34D399">Zero Silent Drops</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(60, 735)">
    <text x="0" y="0" class="flow-label">Demo Market Portfolio • Built for ESOLS Technologies Practical Assessment • Engineer: Nasir Ali</text>
  </g>
</svg>
